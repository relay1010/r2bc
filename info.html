    <script>
        function myFunc() {
   var patt = new RegExp("\d{3}[\-]\d{2}[\-]\d{4}");
   var x = document.getElementById("ssn");
   var res = patt.test(x.value);
   if(!res){
    x.value = x.value
        .match(/\d*/g).join('')
        .match(/(\d{0,3})(\d{0,3})(\d{0,3})/).slice(1).join('-')
        .replace(/-*$/g, '');
   }
}
        document.getElementById('BirthDD').onkeydown = function (e) {

             if (!e.key.match(/[a0-9,]/)) {

             };
